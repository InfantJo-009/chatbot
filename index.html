<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groq AI Chatbot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --chat-bg: #1e293b;
            --primary-gradient: linear-gradient(135deg, #f55036 0%, #d946ef 100%);
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --bot-msg-bg: #334155;
            --input-bg: rgba(15, 23, 42, 0.6);
            --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(245, 80, 54, 0.15) 0, transparent 50%), 
                radial-gradient(at 100% 0%, rgba(217, 70, 239, 0.15) 0, transparent 50%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-primary);
            overflow: hidden;
        }

        .app-container {
            width: 100%; max-width: 500px; height: 90vh;
            background: var(--glass-bg);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border); border-radius: 24px;
            box-shadow: var(--shadow);
            display: flex; flex-direction: column; position: relative; overflow: hidden;
        }

        header {
            padding: 20px; background: rgba(15, 23, 42, 0.4);
            border-bottom: 1px solid var(--glass-border);
            display: flex; justify-content: space-between; align-items: center; z-index: 10;
        }

        .bot-profile { display: flex; align-items: center; gap: 12px; }
        .avatar {
            width: 40px; height: 40px; border-radius: 50%;
            background: var(--primary-gradient);
            display: flex; justify-content: center; align-items: center;
            font-weight: bold; font-size: 18px;
            box-shadow: 0 4px 12px rgba(245, 80, 54, 0.3);
        }
        .bot-info h2 { font-size: 16px; font-weight: 600; }
        .status-dot {
            display: inline-block; width: 8px; height: 8px;
            background-color: #22c55e; border-radius: 50%; margin-right: 6px;
            animation: pulse 2s infinite;
        }
        .bot-info p { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; }

        #chat-window {
            flex: 1; padding: 20px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth;
        }

        #chat-window::-webkit-scrollbar { width: 6px; }
        #chat-window::-webkit-scrollbar-track { background: transparent; }
        #chat-window::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 3px; }

        .message {
            max-width: 80%; padding: 12px 16px; border-radius: 18px;
            font-size: 14px; line-height: 1.5;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            word-wrap: break-word;
        }
        .message.user {
            align-self: flex-end; background: var(--primary-gradient); color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(245, 80, 54, 0.2);
        }
        .message.bot {
            align-self: flex-start; background: var(--bot-msg-bg); color: var(--text-primary);
            border-bottom-left-radius: 4px; border: 1px solid var(--glass-border);
        }
        .message.error {
            background: rgba(239, 68, 68, 0.2); color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
            align-self: center; font-size: 13px;
        }
        
        .message.bot strong { color: #f9a8d4; font-weight: 600; }
        .message.bot code { background: rgba(0,0,0,0.3); padding: 2px 4px; border-radius: 4px; font-family: monospace; font-size: 0.9em; }

        .typing-indicator {
            align-self: flex-start; background: var(--bot-msg-bg);
            padding: 12px 16px; border-radius: 18px; border-bottom-left-radius: 4px;
            display: none; align-items: center; gap: 4px;
        }
        .dot { width: 6px; height: 6px; background: var(--text-secondary); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        .input-area {
            padding: 20px; background: rgba(15, 23, 42, 0.4);
            border-top: 1px solid var(--glass-border);
            display: flex; gap: 10px; align-items: flex-end;
        }
        .input-wrapper {
            flex: 1; background: var(--input-bg); border-radius: 20px;
            padding: 10px 15px; border: 1px solid var(--glass-border);
            display: flex; align-items: center; transition: border 0.3s;
        }
        .input-wrapper:focus-within { border-color: #f55036; }
        textarea {
            width: 100%; background: transparent; border: none; color: white;
            resize: none; height: 24px; max-height: 100px; outline: none;
            font-size: 14px; padding: 0; line-height: 1.5;
        }
        textarea::placeholder { color: rgba(255, 255, 255, 0.3); }

        .send-btn {
            width: 44px; height: 44px; border-radius: 50%; background: var(--primary-gradient);
            border: none; color: white; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            transition: transform 0.2s, box-shadow 0.2s; flex-shrink: 0;
        }
        .send-btn:hover { transform: scale(1.05); box-shadow: 0 4px 12px rgba(245, 80, 54, 0.4); }
        .send-btn:active { transform: scale(0.95); }
        .send-btn svg { width: 20px; height: 20px; fill: currentColor; margin-left: 2px; }

        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); } 70% { box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); } 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); } }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        @keyframes popIn { 0% { opacity: 0; transform: translateY(10px) scale(0.95); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="bot-profile">
                <div class="avatar">GQ</div>
                <div class="bot-info">
                    <h2>Saarah AI</h2>
                    <p><span class="status-dot"></span>Server-Hosted Mode</p>
                </div>
            </div>
        </header>

        <div id="chat-window">
            <div class="message bot">
                Hello! I'm connected to the secure backend. Start chatting!
            </div>
        </div>

        <div class="typing-indicator" id="typing-indicator">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="user-input" placeholder="Type a message..." rows="1"></textarea>
            </div>
            <button class="send-btn" id="send-btn">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
            </button>
        </div>
    </div>

    <script>
        // DOM Elements
        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const typingIndicator = document.getElementById('typing-indicator');

        // No API Key needed here! It talks to our local/server backend.
        
        sendBtn.addEventListener('click', handleSendMessage);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSendMessage();
            }
        });

        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            if(this.value === '') this.style.height = '24px';
        });

        async function handleSendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            userInput.value = '';
            userInput.style.height = '24px';
            showLoading(true);

            try {
                // Call OUR backend server, not Groq directly
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error);
                }

                const botReply = data.reply;
                showLoading(false);
                addMessage(botReply, 'bot');

            } catch (error) {
                showLoading(false);
                console.error(error);
                addMessage(`Error: ${error.message}`, 'error');
            }
        }

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.classList.add('message', sender);
            div.textContent = text; // Simple text for now, or use formatText function
            if (sender === 'bot') div.innerHTML = formatText(text); 
            chatWindow.appendChild(div);
            scrollToBottom();
        }

        function showLoading(show) {
            if (show) {
                typingIndicator.style.display = 'flex';
                chatWindow.appendChild(typingIndicator);
                scrollToBottom();
            } else {
                typingIndicator.style.display = 'none';
            }
        }

        function scrollToBottom() {
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function formatText(text) {
            let safeText = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            safeText = safeText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            safeText = safeText.replace(/`(.*?)`/g, '<code>$1</code>');
            safeText = safeText.replace(/\n/g, '<br>');
            return safeText;
        }
    </script>
</body>
</html>
